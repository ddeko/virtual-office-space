# fly.toml app configuration file generated for virtual-office-space on 2026-10-01T15:17:08+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'virtual-office-space'
primary_region = 'sin'

[build]
[[mounts]]
  source = 'office_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
