# fly launch --copy-config --no-deploy, then: fly volumes create office_data --size 1 && fly secrets set OWNER_KEY=... && fly deploy
app = "virtual-office-space"
primary_region = "sin"

[mounts]
  source = "office_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # one always-on machine: sessions live in memory and the layout lives on the volume
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
