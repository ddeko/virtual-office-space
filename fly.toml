# fly.toml app configuration file generated for virtual-office-space on 2026-10-01T15:17:08+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'virtual-office-space'
primary_region = 'sin'

[build]
[[mounts]]
  source = 'office_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
